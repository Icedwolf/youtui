[package]
name = "youtui"
version = "0.0.37"
# Required for let chains
edition = "2024"
authors = ["nick42d"]
license = "MIT"
description = "A simple TUI YouTube Music player"
homepage = "https://github.com/Icedwolf/youtui"
repository = "https://github.com/Icedwolf/youtui"
readme = "../README.md"
keywords = ["youtube", "music", "player", "tui"]
categories = ["multimedia::audio"]
# Required for ceil_char_boundary
rust-version = "1.91"

[features]
default = []
profile-render = []

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.3"
crossterm = { version = "0.29.0", features = ["event-stream", "serde"] }
futures = "0.3.33"

rat-text = "3.1.0"
ratatui = "0.30.2"

serde = { version = "1.0.229", features = ["rc"] }
serde_json = "1.0.151"
ytmapi-rs = { path = "../ytmapi-rs", version = "0.3.2", default-features = false, features = ["reqwest", "rustls", "simplified-queries"] }
reqwest = { version = "0.13", default-features = false, features = [] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
directories = "6.0.0"
toml = "1.1.3"
itertools = "0.14.0"
tokio-stream = { version = "0.1.19", features = ["fs"] }
async_cell = "0.2.3"
anyhow = "1.0.104"
souvlaki = { version = "0.8.3", default-features = false, features = [
    "use_zbus",
  ] }
notify-rust = "4.18.0"
rand = "0.10"
fs-err = { version = "3.3.1", features=["tokio"] }
tokio-util = { version = "0.7.19", features = ["io"] }

# Audio playback library (rodio with symphonia codecs)
[dependencies.rodio]
version = "0.22.2"
default-features = false
features = ["playback", "tracing", "symphonia-wav", "symphonia-pcm", "symphonia-isomp4", "symphonia-aac", "symphonia-alac"]


# Direct Symphonia usage (not through rodio, avoiding SeekError panic)
# Symphonia 0.5 supports: isomp4 (MP4/M4A), mkv (WebM), ogg (Ogg/Vorbis)
# Codecs: aac, alac, flac, mp3, pcm, vorbis via feature unification with rodio's
# features (alac comes from rodio's "symphonia-alac"; the shared facade enables
# it for BOTH rodio and the direct decoder's register_enabled_codecs).
# NO Opus support. No additional features needed on the direct dep.
[dependencies.symphonia]
version = "0.5"

# These platforms require an open window to use media controls.
# https://github.com/Sinono3/souvlaki/blob/master/examples/window.rs
[target.'cfg(any(target_os="windows",target_os="macos"))'.dependencies]
raw-window-handle = "0.6.2"
winit = "0.30.13"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
criterion = "0.8"

[lints]
workspace = true
